name: Concern titles patch

on:
  push:
    branches:
      - pre-note3-copy-polish-final

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Personalize NOTE concern titles') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-note3-copy-polish-final
      - name: Apply title patch
        run: python3 tests/patch_concern_titles.py
      - name: Commit title patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Personalize NOTE concern titles"
          git push origin HEAD:pre-note3-copy-polish-final
