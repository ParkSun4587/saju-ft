name: NOTE3 blind spot audit

on:
  push:
    branches:
      - note3-blindspot-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply NOTE3 blind spot builder') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: note3-blindspot-v1
      - name: Apply guarded NOTE3 patch
        run: python3 tests/patch_note3_blindspot.py
      - name: Commit patched NOTE3 and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/pre_note3_browser_regression_v4.cjs
          git commit -m "Apply NOTE3 blind spot builder"
          git push origin HEAD:note3-blindspot-v1

  regression:
    if: ${{ contains(github.event.head_commit.message, 'Apply NOTE3 blind spot builder') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright lunar-javascript korean-lunar-calendar >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          pip install sxtwl >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Run manse validation
        run: |
          python3 tests/generate_sxtwl_cases.py
          node tests/validate_manse_1_4.cjs
      - name: Validate elapsed Jie days and saryeong
        run: node tests/validate_days_from_jie.cjs
      - name: Run classical engine validation
        run: node tests/validate_classical_5_7.cjs
      - name: Run NOTE3 and full browser regression
        run: node tests/pre_note3_browser_regression_v4.cjs
