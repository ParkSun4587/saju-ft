name: Production mobile smoke

on:
  push:
    branches:
      - copy-freeze-production-smoke-20260922

jobs:
  production-mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8c482752316665b78558f84aa0ca5342fe25e53b
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve final candidate
        run: |
          python3 -m http.server 4174 >/tmp/saju-final-smoke.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4174/index.html >/dev/null
      - name: Test final candidate mobile journey
        env:
          PRODUCTION_BASE: http://127.0.0.1:4174/index.html
        run: node tests/production_mobile_smoke.cjs
      - name: Capture final candidate result longshots
        env:
          PRODUCTION_BASE: http://127.0.0.1:4174/index.html
        run: node tests/result_ui_longshot.cjs
      - name: Upload result UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-ui-mobile-screenshots
          path: /tmp/result-ui-*.png
          if-no-files-found: ignore
          retention-days: 3
