name: Production mobile smoke

on:
  push:
    branches:
      - main

jobs:
  production-mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Test live mobile journey
        env:
          PRODUCTION_BASE: https://sajuft.com/index.html
        run: node tests/production_mobile_smoke.cjs
