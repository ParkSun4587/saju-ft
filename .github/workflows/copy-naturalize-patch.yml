name: Copy naturalize patch

on:
  push:
    branches:
      - pre-note3-copy-polish-final

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Naturalize NOTE copy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-note3-copy-polish-final
      - name: Apply natural copy patch
        run: python3 tests/patch_copy_naturalize.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Naturalize NOTE copy"
          git push origin HEAD:pre-note3-copy-polish-final
