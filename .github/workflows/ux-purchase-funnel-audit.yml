name: UX purchase funnel audit

on:
  push:
    branches:
      - ux-mobile-purchase-funnel-20260920
    paths:
      - tests/ux_purchase_funnel_audit.cjs
      - .github/workflows/ux-purchase-funnel-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Capture purchase funnel
        run: node tests/ux_purchase_funnel_audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-purchase-funnel-audit
          path: audit/*.png

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright lunar-javascript korean-lunar-calendar >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          pip install sxtwl >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Run manse 1-4 validation
        run: |
          python3 tests/generate_sxtwl_cases.py
          node tests/validate_manse_1_4.cjs
      - name: Validate elapsed Jie days and saryeong activation
        run: node tests/validate_days_from_jie.cjs
      - name: Run classical 5-7 validation
        run: node tests/validate_classical_5_7.cjs
      - name: Run full browser regression
        run: node tests/pre_note3_browser_regression_v4.cjs
      - name: Run integrated profile regression
        run: node tests/integrated_profile_regression.cjs
      - name: Run classical causal reasoning A-G regression
        run: node tests/classical_reasoning_v3_regression.cjs
      - name: Run classical depth v3.1 regression
        run: node tests/classical_depth_v31_regression.cjs
      - name: Run product content boundary regression
        run: node tests/product_content_boundary_regression.cjs
      - name: Run legacy timing, policy gate and leap-month regression
        run: node tests/tech_debt_policy_leap_regression.cjs
      - name: Run premium hierarchy and entitlement regression
        run: node tests/premium_entitlement_ladder_regression.cjs
      - name: Run paid-value and product regression
        run: node tests/paid_value_product_regression.cjs
