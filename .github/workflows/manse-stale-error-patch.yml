name: Manse stale error patch

on:
  push:
    branches:
      - pre-note3-manse-cache-hotfix

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Preserve stale manse diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-note3-manse-cache-hotfix
      - name: Preserve stale manse diagnostic
        run: python3 tests/patch_manse_stale_error.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Preserve stale manse diagnostic"
          git push origin HEAD:pre-note3-manse-cache-hotfix
