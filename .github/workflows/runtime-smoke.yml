name: Runtime browser smoke

on:
  push:
    branches:
      - runtime-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Run runtime smoke
        run: node tests/runtime_smoke.cjs
