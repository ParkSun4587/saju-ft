name: Product ladder patch

on:
  push:
    branches:
      - product-ladder-note-qa-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Wire product ladder and paid-value layer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-ladder-note-qa-v1
      - name: Patch index and wrapper metadata
        run: python3 tests/patch_product_ladder.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html paid-value-layer-v1.js tests/integrated_profile_regression.cjs
          if git diff --cached --quiet; then
            echo "No patch change"
          else
            git commit -m "Wire product ladder and paid-value layer"
            git push origin HEAD:product-ladder-note-qa-v1
          fi
