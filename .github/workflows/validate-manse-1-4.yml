name: Validate Korean manse 1-4
on:
  push:
    branches: [manse-korea-stage1]
    paths:
      - 'manse-korea-v2.js'
      - 'tests/**'
      - '.github/workflows/validate-manse-1-4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference engines
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --ignore-scripts lunar-javascript@1.7.7 korean-lunar-calendar@0.4.0 >/dev/null
          python -m pip install --quiet sxtwl
      - name: Generate sxtwl reference cases
        run: python tests/generate_sxtwl_cases.py
      - name: Validate calendar engine
        run: node tests/validate_manse_1_4.cjs
      - name: Static integration checks
        run: |
          node --check manse-korea-v2.js
          grep -q 'korean-lunar-calendar@0.4.0' index.html
          grep -q 'createKoreanHybridBaZi' index.html
          grep -q 'koreanLunarToSolar' index.html
          grep -q 'calendarMeta' index.html
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: manse-1-4-report
          path: /tmp/manse_1_4_report.json
