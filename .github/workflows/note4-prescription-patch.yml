name: NOTE4 prescription patch

on:
  push:
    branches:
      - pre-note3-note4-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply NOTE4 prescription builder') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-note3-note4-v1
      - name: Apply guarded NOTE4 patch
        run: python3 tests/patch_note4_prescription.py
      - name: Commit NOTE4 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/pre_note3_browser_regression_v4.cjs
          git commit -m "Apply NOTE4 prescription builder"
          git push origin HEAD:pre-note3-note4-v1
