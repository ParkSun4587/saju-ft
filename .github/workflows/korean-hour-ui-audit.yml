name: Korean hour and pillar UI audit

on:
  push:
    branches:
      - manse-korea-hour-ui-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Korean manse hour correction and pillar UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manse-korea-hour-ui-audit
      - name: Apply guarded patch
        run: python3 tests/patch_korean_hour_and_pillar_ui.py
      - name: Commit patched app and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manse-korea-v2.js index.html tests/generate_sxtwl_cases.py tests/validate_manse_1_4.cjs tests/pre_note3_browser_regression_v4.cjs
          git commit -m "Apply Korean manse hour correction and pillar UI"
          git push origin HEAD:manse-korea-hour-ui-audit

  regression:
    if: ${{ contains(github.event.head_commit.message, 'Apply Korean manse hour correction and pillar UI') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright lunar-javascript korean-lunar-calendar >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          pip install sxtwl >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Validate manse calendar and Korean hour correction
        run: |
          python3 tests/generate_sxtwl_cases.py
          node tests/validate_manse_1_4.cjs
      - name: Validate elapsed Jie days and saryeong
        run: node tests/validate_days_from_jie.cjs
      - name: Validate classical engine
        run: node tests/validate_classical_5_7.cjs
      - name: Run full browser regression
        run: node tests/pre_note3_browser_regression_v4.cjs
