name: Korean hour and pillar UI audit

on:
  push:
    branches:
      - manse-korea-hour-ui-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manse-korea-hour-ui-audit
      - name: Apply audit follow-up patch
        run: python3 tests/fix_korean_hour_audit_followup.py
      - name: Commit follow-up if changed
        run: |
          if git diff --quiet -- index.html tests/pre_note3_browser_regression_v4.cjs; then
            echo "No follow-up changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html tests/pre_note3_browser_regression_v4.cjs
            git commit -m "Tighten Korean hour UI regression"
            git push origin HEAD:manse-korea-hour-ui-audit
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright lunar-javascript korean-lunar-calendar >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          pip install sxtwl >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Validate manse calendar and Korean hour correction
        run: |
          python3 tests/generate_sxtwl_cases.py
          node tests/validate_manse_1_4.cjs
      - name: Validate elapsed Jie days and saryeong
        run: node tests/validate_days_from_jie.cjs
      - name: Validate classical engine
        run: node tests/validate_classical_5_7.cjs
      - name: Run full browser regression
        run: node tests/pre_note3_browser_regression_v4.cjs
