name: Integrate classical engine v2
on:
  push:
    branches: [manse-korea-stage1]
    paths: ['.github/workflows/integrate-classical-v2.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          if './classical-engine-v2.js' not in s:
              old='  <script src="./manse-korea-v2.js?v=2"></script>\n</body>'
              new='  <script src="./manse-korea-v2.js?v=2"></script>\n  <script src="./classical-engine-v2.js?v=2"></script>\n</body>'
              if s.count(old)!=1: raise SystemExit(f'classical script anchor count={s.count(old)}')
              s=s.replace(old,new)

          pat=re.compile(r'''          // \[이론 검증 1단계\][\s\S]*?          const analysisProfile = buildAnalysisProfile\(\{''')
          matches=list(pat.finditer(s))
          if len(matches)!=1: raise SystemExit(f'strength/yong block count={len(matches)}')
          replacement='''          // [명리 엔진 v2] 월령·통근·천간/지장간 세력을 분리해 신강·중화·신약을 판정한다.\n          if (typeof analyzeDayMasterStrengthV2 !== "function") {\n            throw new Error("명리 분석 엔진을 불러오지 못했습니다.");\n          }\n          const classicalPillarsV2 = {\n            year: { gan: baZi.getYearGan(), zhi: baZi.getYearZhi() },\n            month: { gan: baZi.getMonthGan(), zhi: baZi.getMonthZhi() },\n            day: { gan: baZi.getDayGan(), zhi: baZi.getDayZhi() },\n            ...(hourKnown\n              ? { hour: { gan: baZi.getTimeGan(), zhi: baZi.getTimeZhi() } }\n              : {}),\n          };\n          const elementProfilesV2 = getElementProfilesV2(classicalPillarsV2);\n          const strengthV2 = analyzeDayMasterStrengthV2({\n            pillars: classicalPillarsV2,\n          });\n          // 기존 UI/문구의 boolean 호환은 유지하되, 실제 3분류 값은 strengthV2.verdict를 사용한다.\n          const isDayMasterStrong =\n            strengthV2.verdict === "신강" ||\n            (strengthV2.verdict === "중화" && strengthV2.supportRatio >= 0.5);\n          const preliminaryGyeokV2 = determineGyeokgukFromPillarsV2(\n            classicalPillarsV2,\n            calendarMeta || {},\n          );\n          const yongshinDetailV2 = selectYongshinV2({\n            pillars: classicalPillarsV2,\n            strength: strengthV2,\n            elementProfiles: elementProfilesV2,\n            gyeokguk: preliminaryGyeokV2,\n          });\n          const yongshin = yongshinDetailV2.primary;\n          const analysisProfile = buildAnalysisProfile({'''
          s=pat.sub(replacement,s,count=1)

          old='''          const gyeokguk = determineGyeokguk(baZi, gyeokCandidates);\n          const pillarSipsin = getPillarSipsinSet(baZi, !!(hourKnown && hGan));\n          const gyeokStatus = evaluateGyeokStatus(gyeokguk, pillarSipsin);'''
          new='''          const gyeokguk = preliminaryGyeokV2;\n          const pillarSipsin = getPillarSipsinSet(baZi, !!(hourKnown && hGan));\n          const gyeokStatus = evaluateGyeokStatusV2(gyeokguk, pillarSipsin);'''
          if s.count(old)!=1: raise SystemExit(f'gyeok integration count={s.count(old)}')
          s=s.replace(old,new)

          # Replace the legacy classical-layer call only; keep buildAnalysisProfile for backward-compatible fields.
          pat2=re.compile(r'''          analysisProfile\.classical = buildClassicalLayers\(\{[\s\S]*?\n          \}\);''')
          m2=list(pat2.finditer(s))
          if len(m2)!=1: raise SystemExit(f'classical-layer block count={len(m2)}')
          rep2='''          analysisProfile.dayMaster.strength = strengthV2.verdict;\n          analysisProfile.dayMaster.strengthScore = strengthV2.score;\n          analysisProfile.dayMaster.supportRatio = strengthV2.supportRatio;\n          analysisProfile.strengthDetail = strengthV2;\n          analysisProfile.elementProfiles = elementProfilesV2;\n          analysisProfile.yongshinDetail = yongshinDetailV2;\n          analysisProfile.structure.basis = gyeokguk.basis || "";\n          analysisProfile.structure.branchType = gyeokguk.branchType || "";\n          analysisProfile.structure.saryeongGan = gyeokguk.saryeongGan || "";\n          analysisProfile.structure.candidates = gyeokguk.candidates || [];\n          analysisProfile.classical = buildClassicalLayersV2({\n            pillars: classicalPillarsV2,\n            strength: strengthV2,\n            elementProfiles: elementProfilesV2,\n            gyeokguk: gyeokguk,\n            yongshinDetail: yongshinDetailV2,\n            calendarMeta: calendarMeta || {},\n          });'''
          s=pat2.sub(rep2,s,count=1)

          # Expose transparent v2 calculation details without breaking old UI consumers.
          old_return='''            analysisProfile: analysisProfile,\n            calendarMeta: calendarMeta || null,\n            isDayMasterStrong: isDayMasterStrong,'''
          new_return='''            analysisProfile: analysisProfile,\n            calendarMeta: calendarMeta || null,\n            strengthDetail: strengthV2,\n            yongshinDetail: yongshinDetailV2,\n            elementProfiles: elementProfilesV2,\n            isDayMasterStrong: isDayMasterStrong,'''
          if s.count(old_return)!=1: raise SystemExit(f'return details count={s.count(old_return)}')
          s=s.replace(old_return,new_return)
          p.write_text(s)
          PY
          git diff --check
          grep -q 'analyzeDayMasterStrengthV2' index.html
          grep -q 'evaluateGyeokStatusV2' index.html
          grep -q 'buildClassicalLayersV2' index.html
          grep -q 'classical-engine-v2.js?v=2' index.html
      - name: Commit integration and remove temporary workflow
        run: |
          rm .github/workflows/integrate-classical-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/integrate-classical-v2.yml
          git commit -m 'Integrate classical analysis engine v2'
          git push origin HEAD:manse-korea-stage1
