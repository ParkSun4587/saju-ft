name: Profile audit
on:
  push:
    branches: [unified-saju-v3]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-saju-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          node tests/audit_profile_keys.cjs
