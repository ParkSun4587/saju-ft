name: Patch middle-strength note logic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-note3-regression
      - name: Patch tri-state strength handling
        run: python3 tests/patch_middle_strength.py
      - name: Commit patch if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Handle middle-strength notes without weak fallback"
          git push origin HEAD:pre-note3-regression
