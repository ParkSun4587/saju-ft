name: Patch middle-strength note logic

on:
  push:
    branches:
      - pre-note3-regression

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-note3-regression
      - name: Patch tri-state strength handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''        const strength =
          dayMaster.strength || (data.isDayMasterStrong ? "신강" : "신약");
        const isStrong = strength === "신강";'''
          new = '''        const strength =
          dayMaster.strength || (data.isDayMasterStrong ? "신강" : "신약");
        const supportRatio = Number(dayMaster.supportRatio);
        const isBalanced = strength === "중화";
        const leansStrong =
          strength === "신강" ||
          (isBalanced && Number.isFinite(supportRatio) && supportRatio >= 0.5);'''
          if old not in s:
              raise SystemExit('NOTE1 strength block not found')
          s = s.replace(old, new, 1)

          old = '''        const opening = isT
          ? isStrong
            ? scene.strongT
            : scene.weakT
          : isStrong
            ? scene.strongF
            : scene.weakF;'''
          new = '''        const opening = isT
          ? leansStrong
            ? scene.strongT
            : scene.weakT
          : leansStrong
            ? scene.strongF
            : scene.weakF;'''
          if old not in s:
              raise SystemExit('NOTE1 opening block not found')
          s = s.replace(old, new, 1)

          old = '''        const clash = relations.hasChung
          ? isT
            ? "원국의 충도 함께 보여서 오래 참다가 한 번에 방향을 바꾸는 반응이 더 선명해."
            : "원국의 충도 함께 보여서 참고 싶은 마음과 벗어나고 싶은 마음이 안에서 자주 부딪혔어."
          : "이번 원국에서는 감정을 즉시 뒤집기보다 속에서 충분히 판단한 뒤 움직이는 흐름이 더 보여.";'''
          new = '''        const clash = relations.hasChung
          ? isT
            ? "원국의 충도 함께 보여서 오래 참다가 한 번에 방향을 바꾸는 반응이 더 선명해."
            : "원국의 충도 함께 보여서 참고 싶은 마음과 벗어나고 싶은 마음이 안에서 자주 부딪혔어."
          : "이번 원국에서는 감정을 즉시 뒤집기보다 속에서 충분히 판단한 뒤 움직이는 흐름이 더 보여.";
        const balanceNote = isBalanced
          ? " <b>중화</b>라 한쪽 반응으로 고정되기보다, 상황에 따라 버티는 쪽과 주변 반응을 흡수하는 쪽이 번갈아 나타나는 편이야."
          : "";'''
          if old not in s:
              raise SystemExit('NOTE1 clash block not found')
          s = s.replace(old, new, 1)

          old = '''const strengthLabelMap = {
  신강: "신강(내 힘으로 버티는 쪽)",
  신약: "신약(주변 자극을 먼저 흡수하는 쪽)",
};'''
          new = '''const strengthLabelMap = {
  신강: "신강(내 힘으로 버티는 쪽)",
  중화: "중화(한쪽으로 치우치지 않은 균형형)",
  신약: "신약(주변 자극을 먼저 흡수하는 쪽)",
};'''
          if old not in s:
              raise SystemExit('strength label map not found')
          s = s.replace(old, new, 1)

          old = '''          desc: `${opening}<br><br>${inner} ${clash}<div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[10.5px] leading-relaxed text-slate-600"><b class="text-slate-800">언니가 잡은 사주 근거</b><br>${basis}</div>`,'''
          new = '''          desc: `${opening}<br><br>${inner} ${clash}${balanceNote}<div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[10.5px] leading-relaxed text-slate-600"><b class="text-slate-800">언니가 잡은 사주 근거</b><br>${basis}</div>`,'''
          if old not in s:
              raise SystemExit('NOTE1 desc block not found')
          s = s.replace(old, new, 1)

          old = '''  const strength =
    dayMaster.strength ||
    (data.isDayMasterStrong ? "신강" : "신약");

  const isStrong = strength === "신강";'''
          new = '''  const strength =
    dayMaster.strength ||
    (data.isDayMasterStrong ? "신강" : "신약");'''
          if old not in s:
              raise SystemExit('NOTE2 strength block not found')
          s = s.replace(old, new, 1)

          old = '''  const strengthReason = isStrong
    ? "버티는 힘이 강해서 불편해도 괜찮은 척 넘기는 시간이 길어지고"
    : "주변 반응을 빠르게 흡수해서 작은 신호에도 마음이 먼저 흔들리고";'''
          new = '''  const strengthReason =
    strength === "신강"
      ? "버티는 힘이 강해서 불편해도 괜찮은 척 넘기는 시간이 길어지고"
      : strength === "신약"
        ? "주변 반응을 빠르게 흡수해서 작은 신호에도 마음이 먼저 흔들리고"
        : "신강·신약 한쪽으로 치우치지 않아 상황에 따라 버티기와 주변 반응 흡수가 번갈아 나타나고";'''
          if old not in s:
              raise SystemExit('NOTE2 strength reason block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Handle middle-strength notes without weak fallback"
          git push origin HEAD:pre-note3-regression
