name: Final copy targeted legacy QA

on:
  push:
    branches:
      - 'code-diet-copy-target-*'

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4b946d1f505f4b6b88ee9d06ab8f36e4ce25e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install targeted dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright lunar-javascript korean-lunar-calendar >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Run legacy timing, policy gate and leap-month regression
        run: node tests/tech_debt_policy_leap_regression.cjs
