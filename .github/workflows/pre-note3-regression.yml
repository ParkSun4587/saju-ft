name: Pre-Note3 browser regression

on:
  push:
    branches:
      - pre-note3-regression
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright lunar-javascript korean-lunar-calendar >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          pip install sxtwl >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Run existing manse 1-4 validation
        run: |
          python3 tests/generate_sxtwl_cases.py
          node tests/validate_manse_1_4.cjs
      - name: Run existing classical 5-7 validation
        run: node tests/validate_classical_5_7.cjs
      - name: Run full browser regression
        run: node tests/pre_note3_browser_regression_v2.cjs
