name: Final copy targeted QA

on:
  push:
    branches:
      - 'code-diet-copy-target-*'

jobs:
  copy-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install targeted test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright lunar-javascript korean-lunar-calendar >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/saju-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Run final copy runtime regression
        run: node tests/paid_value_product_regression.cjs
      - name: Run product boundary copy regression
        run: node tests/product_content_boundary_regression.cjs
