name: Final main copy freeze screen QA

on:
  push:
    branches:
      - 'code-diet-copy-target-*'

jobs:
  screen-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97dbf6e825500f6541c02413274f9e58944470b1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install targeted browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright lunar-javascript korean-lunar-calendar >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve main
        run: |
          python3 -m http.server 4173 >/tmp/saju-main-copy-freeze.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Compare same scenario F/T and approved copy fixes
        run: node tests/paid_value_product_regression.cjs
