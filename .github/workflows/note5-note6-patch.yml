name: NOTE5 NOTE6 patch

on:
  push:
    branches:
      - pre-note3-note5-6-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply NOTE5 and NOTE6 builders') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-note3-note5-6-v1
      - name: Apply guarded NOTE5 NOTE6 patch
        run: python3 tests/patch_note5_note6.py
      - name: Commit NOTE5 NOTE6 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/pre_note3_browser_regression_v4.cjs
          git commit -m "Apply NOTE5 and NOTE6 builders"
          git push origin HEAD:pre-note3-note5-6-v1
