name: Integrated profile patch

on:
  push:
    branches:
      - integrated-profile-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Wire integrated profile engine') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrated-profile-v1
      - name: Patch index include
        run: python3 tests/patch_integrated_profile_include.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change"
          else
            git commit -m "Wire integrated profile engine"
            git push origin HEAD:integrated-profile-v1
          fi
