name: Integrated legacy test patch

on:
  push:
    branches:
      - integrated-profile-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Update legacy NOTE3 integration assertion') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrated-profile-v1
      - name: Patch legacy assertion
        run: python3 tests/patch_integrated_legacy_assertion.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pre_note3_browser_regression_v4.cjs
          git commit -m "Update legacy NOTE3 integration assertion"
          git push origin HEAD:integrated-profile-v1
