name: Stale console test patch

on:
  push:
    branches:
      - pre-note3-manse-cache-hotfix

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Accept expected stale diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-note3-manse-cache-hotfix
      - name: Patch expected stale diagnostic test
        run: python3 tests/patch_stale_console_test.py
      - name: Commit test patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pre_note3_browser_regression_v4.cjs
          git commit -m "Accept expected stale diagnostic"
          git push origin HEAD:pre-note3-manse-cache-hotfix
